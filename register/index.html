<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002b36">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png?v=2769fee676">
    <link type="text/css" rel="stylesheet" href="/static/css/auth.css?v=4056d1833b">
    <title>Register · relaychat.party</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark"><a href="/" title="IRC, with pictures">:relaychat: 👋</a></h1>
      <nav><a href="/login/">Log in</a></nav>
    </header>

    <main>
      <form method="POST" data-api="/api/register">
        <h2>Register</h2>
        <p class="error" role="alert"></p>
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autocomplete="username" autocorrect="off" autocapitalize="none" required autofocus>
        <label for="email">Email address</label>
        <input type="email" name="email" id="email" autocomplete="email" required>
        <label for="pass">Password</label>
        <input type="password" name="pass" id="pass" autocomplete="new-password" required>
        <input type="submit" value="Register">
        <p class="alt">Have an account? <a href="/login/">Log in</a></p>
      </form>
    </main>

    <script src="/static/js/auth-page.js?v=2d7c4ab082"></script>
  </body>
</html>
