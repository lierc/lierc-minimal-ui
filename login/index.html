<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002b36">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png?v=2769fee676">
    <link type="text/css" rel="stylesheet" href="/static/css/auth.css?v=c918062935">
    <title>Log in · relaychat.party</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark"><a href="/" title="IRC, with pictures">:relaychat: 👋</a></h1>
      <nav><a href="/register/">Register</a></nav>
    </header>

    <main>
      <form method="POST" data-api="/api/auth">
        <h2>Log in</h2>
        <p class="error" role="alert"></p>
        <label for="email">Email or username</label>
        <input type="text" name="email" id="email" autocomplete="username" autocorrect="off" autocapitalize="none" required autofocus>
        <label for="pass">Password</label>
        <input type="password" name="pass" id="pass" autocomplete="current-password" required>
        <p class="forgot"><a href="/reset/">Forgot your password?</a></p>
        <input type="submit" value="Log in">
        <p class="alt">No account? <a href="/register/">Register</a></p>
      </form>
    </main>

    <script src="/static/js/auth-page.js?v=45d1d8c79e"></script>
  </body>
</html>
