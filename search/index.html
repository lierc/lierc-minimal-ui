<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/fontawesome.min.css?v=69aaf8f88a"></link>
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/solid.min.css?v=79cc2bdfdd"></link>
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/brands.min.css?v=bbacc07258"></link>
    <link type="text/css" rel="stylesheet" href="/static/css/lierc.css?v=959de2cadb"></link>
    <link type="text/css" rel="stylesheet" href="/static/css/search.css?v=1e492be531"></link>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="description" content="Chat on IRC in a web browser">
    <meta name="keywords" content="IRC,cloud,HTTP,chat,browser,irccloud,relaychat,party">
    <meta name="author" content="Lee Aylward">
    <title>relaychat.party logs</title>
  </head>
  <body>
    <div class="flex-wrap">

    <div class="flex-wrap-left">
        <header>
          <h1>relaychat<span style="font-weight:normal">.party</span></h1>
        </header>
    <form id="log-search">
      <div class="log-search-group">
        <label for="connection">Connection <span class="required">*</span></label>
        <select id="connection" name="connection" required>
        </select>
      </div>

      <div class="log-search-group">
        <label for="channel">Channel <span class="required">*</span></label>
        <input required list="channels" id="channel" type="text" name="channel" placeholder="#channel">
        <datalist id="channels">
        </datalist>
      </div>

      <div class="log-search-group">
        <label for="sender">Sender</label>
        <input id="sender" type="text" name="sender" placeholder="sender name">
      </div>

      <div class="log-search-group">
        <label for="text">Search text</label>
        <input id="text" type="text" name="text" placeholder="text">
      </div>

      <div class="log-search-group">
        <label for="from">Date range <span class="note">(mm/dd/yyyyy)</span> <span class="required">*</span></label>
        <input required id="from" type="date" name="from">
        <input required id="to" type="date" name="to">
      </div>

      <p class="note"><span class="required">*</span> required</p>

      <div class="log-search-group">
        <input id="submit" type="submit" value="Search">
      </div>

      <p id="status">
      </p>

    </form>


    </div>
    <div class="flex-wrap-right">
        <header id="topic"></header>

    <div class="flex-wrap-panel">
    <div id="panel-scroll">
    <main id="panel">
      <ol id="results"></ol>
    </main>
    </div>
    </div>
    </div>
    </div>

    <script type="text/javascript" src="/static/js/vendor/handlebars.js?v=604619841e"></script>
    <script type="text/javascript" src="/static/js/vendor/datalist-polyfill.js?v=19d7d86751"></script>
    <script type="text/javascript" src="/static/js/templates.js?v=97ffc738be"></script>

    <script type="importmap">
    {
      "imports": {
        "/static/js/lierc/api.js": "/static/js/lierc/api.js?v=eb2b014e42",
        "/static/js/lierc/app.js": "/static/js/lierc/app.js?v=d3fffaeade",
        "/static/js/lierc/auth.js": "/static/js/lierc/auth.js?v=42c1a812b7",
        "/static/js/lierc/channel.js": "/static/js/lierc/channel.js?v=33f56decac",
        "/static/js/lierc/commands.js": "/static/js/lierc/commands.js?v=d6fafd1542",
        "/static/js/lierc/completion.js": "/static/js/lierc/completion.js?v=03e1379ab3",
        "/static/js/lierc/connection.js": "/static/js/lierc/connection.js?v=9ce36b47c6",
        "/static/js/lierc/dialog.js": "/static/js/lierc/dialog.js?v=b2f96427f4",
        "/static/js/lierc/editor.js": "/static/js/lierc/editor.js?v=f1c9f25f9a",
        "/static/js/lierc/embed.js": "/static/js/lierc/embed.js?v=ff5a57b8dc",
        "/static/js/lierc/emoji.js": "/static/js/lierc/emoji.js?v=34fdd7b434",
        "/static/js/lierc/format.js": "/static/js/lierc/format.js?v=e9710b3931",
        "/static/js/lierc/history.js": "/static/js/lierc/history.js?v=7953d76361",
        "/static/js/lierc/logs.js": "/static/js/lierc/logs.js?v=b0de4f5363",
        "/static/js/lierc/notifier.js": "/static/js/lierc/notifier.js?v=72d46368ec",
        "/static/js/lierc/panel.js": "/static/js/lierc/panel.js?v=7a14302c8f",
        "/static/js/lierc/relaymsg.js": "/static/js/lierc/relaymsg.js?v=8035200784",
        "/static/js/lierc/render.js": "/static/js/lierc/render.js?v=a8e8dfb82e",
        "/static/js/lierc/stream.js": "/static/js/lierc/stream.js?v=bdf0845ac9",
        "/static/js/lierc/template.js": "/static/js/lierc/template.js?v=af8a0455df",
        "/static/js/lierc/uievents.js": "/static/js/lierc/uievents.js?v=bed80d70e9"
      }
    }
    </script>

    <script type="module">
      import { Emoji } from "/static/js/lierc/emoji.js";
      import { Logs } from "/static/js/lierc/logs.js";

      Emoji.load();
      var logs = new Logs("/api");
      logs.init();
    </script>
  </body>
</html>
