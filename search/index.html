<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#002b36">
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/fontawesome.min.css"></link>
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/solid.min.css"></link>
    <link type="text/css" rel="stylesheet" href="/static/font-awesome/css/brands.min.css"></link>
    <link type="text/css" rel="stylesheet" href="/static/css/themes.css"></link>
    <link type="text/css" rel="stylesheet" href="/static/css/lierc.css"></link>
    <link type="text/css" rel="stylesheet" href="/static/css/search.css"></link>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="description" content="Chat on IRC in a web browser">
    <meta name="keywords" content="IRC,cloud,HTTP,chat,browser,irccloud,relaychat,party">
    <meta name="author" content="Lee Aylward">
    <title>relaychat.party logs</title>
  </head>
  <body>
    <!-- the cached theme and its theme-color, applied before the first paint (see theme.js) -->
    <script>
      try { var t = localStorage.getItem("theme"); if (t && t != "default" && /^[a-z-]+$/.test(t)) document.body.classList.add(t); } catch (e) {}
      var c = getComputedStyle(document.body).getPropertyValue("--sidebar-bg").trim();
      if (c) document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
    </script>
    <div class="flex-wrap">

    <div class="flex-wrap-left">
        <header>
          <h1>relaychat<span style="font-weight:normal">.party</span></h1>
        </header>
    <form id="log-search">
      <div class="log-search-group">
        <label for="connection">Connection <span class="required">*</span></label>
        <select id="connection" name="connection" required>
        </select>
      </div>

      <div class="log-search-group">
        <label for="channel">Channel <span class="required">*</span></label>
        <input required list="channels" id="channel" type="text" name="channel" placeholder="#channel">
        <datalist id="channels">
        </datalist>
      </div>

      <div class="log-search-group">
        <label for="sender">Sender</label>
        <input id="sender" type="text" name="sender" placeholder="sender name">
      </div>

      <div class="log-search-group">
        <label for="text">Search text</label>
        <input id="text" type="text" name="text" placeholder="text">
      </div>

      <div class="log-search-group">
        <label for="from">Date range <span class="note">(mm/dd/yyyyy)</span> <span class="required">*</span></label>
        <input required id="from" type="date" name="from">
        <input required id="to" type="date" name="to">
      </div>

      <p class="note"><span class="required">*</span> required</p>

      <div class="log-search-group">
        <input id="submit" type="submit" value="Search">
      </div>

      <p id="status">
      </p>

    </form>


    </div>
    <div class="flex-wrap-right">
        <header id="topic"></header>

    <div class="flex-wrap-panel">
    <div id="panel-scroll">
    <main id="panel">
      <ol id="results"></ol>
    </main>
    </div>
    </div>
    </div>
    </div>

    <script type="text/javascript" src="/static/js/vendor/datalist-polyfill.js"></script>


    <script type="module">
      import { Emoji } from "/static/js/lierc/emoji.js";
      import { Logs } from "/static/js/lierc/logs.js";

      Emoji.load();
      var logs = new Logs("/api");
      logs.init();
    </script>
  </body>
</html>
