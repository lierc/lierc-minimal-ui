<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002b36">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link type="text/css" rel="stylesheet" href="/static/css/auth.css">
    <title>Join a channel · relaychat.party</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark"><a href="/" title="IRC, with pictures">:relaychat: 👋</a></h1>
    </header>

    <!-- A channel join link: /join/?network=<preset alias>&channel=<channel>.
         Nothing happens until Join is clicked. -->
    <main data-join>
      <section class="panel" id="logged-out" hidden>
        <h2>Join <b class="channel"></b> on <b class="network"></b></h2>
        <div class="network-info">
          <p class="about"></p>
          <p class="server"></p>
        </div>
        <p>Relaychat is an IRC client in your browser that stays connected when you close the tab.</p>
        <a class="button" id="register" href="/register/">Create an account</a>
        <p class="alt">Have an account? <a id="login" href="/login/">Log in</a></p>
      </section>

      <section class="panel" id="logged-in" hidden>
        <h2>Join <b class="channel"></b> on <b class="network"></b></h2>
        <div class="network-info">
          <p class="about"></p>
          <p class="server"></p>
        </div>
        <p class="error" id="join-error" role="alert"></p>
        <button class="button" id="join" type="button">Join</button>
      </section>

      <section class="panel" id="invalid" hidden>
        <h2>Link not valid</h2>
        <p>This join link isn't valid.</p>
        <p class="alt"><a href="/">Go to relaychat</a></p>
      </section>
    </main>

    <script type="module" src="/static/js/join.js"></script>
  </body>
</html>
