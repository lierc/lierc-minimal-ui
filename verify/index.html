<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002b36">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png?v=2769fee676">
    <link type="text/css" rel="stylesheet" href="/static/css/auth.css?v=c918062935">
    <title>Confirm your email · relaychat.party</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark"><a href="/" title="IRC, with pictures">:relaychat: 👋</a></h1>
      <nav><a href="/login/">Log in</a></nav>
    </header>

    <!-- opened from the emailed link; the script confirms the token after # -->
    <main data-verify>
      <section class="panel" id="confirmed" hidden>
        <h2>Email confirmed</h2>
        <p>Your email address is confirmed.</p>
        <p class="alt"><a href="/app/">Open relaychat</a></p>
      </section>

      <section class="panel" id="invalid" hidden>
        <h2>Link not valid</h2>
        <p>This confirmation link has expired or isn't valid.</p>
        <p class="alt"><a href="/app/">Open relaychat</a></p>
      </section>
    </main>

    <script src="/static/js/auth-page.js?v=5c76bd7d18"></script>
  </body>
</html>
